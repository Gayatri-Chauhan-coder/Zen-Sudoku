
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Zen Sudoku</title>

    <link rel="stylesheet" href="welcome.css">
</head>

<body>

    <main class="welcome-screen">

        <div class="welcome-content">
           
            <!-- Zen Sudoku Logo -->
            <div class="logo">

                <svg viewBox="0 0 100 100"
                     class="lotus-logo"
                     aria-label="Zen Sudoku lotus grid logo">

                    <rect x="10" y="10"
                          width="80" height="80"
                          rx="2"/>

                    <line x1="36.67" y1="10"
                          x2="36.67" y2="90"/>

                    <line x1="63.33" y1="10"
                          x2="63.33" y2="90"/>

                    <line x1="10" y1="36.67"
                          x2="90" y2="36.67"/>

                    <line x1="10" y1="63.33"
                          x2="90" y2="63.33"/>

                    <!-- Lotus -->
                    <path d="M50 65
                             C32 55 35 39 50 29
                             C65 39 68 55 50 65Z"/>

                    <path d="M50 65
                             C29 67 23 52 30 43
                             C40 46 47 54 50 65Z"/>

                    <path d="M50 65
                             C71 67 77 52 70 43
                             C60 46 53 54 50 65Z"/>

                </svg>

            </div>

            <h1>ZEN SUDOKU</h1>

            <p class="tagline">
                Numbers in balance, Mind in harmony.
            </p>

            <div class="divider"></div>

            <h2>Are you ready to play?</h2>

            <button id="begin-btn" type="button">
                Let's Begin <span>→</span>
            </button>
            <button id="quit-btn" type="button">
                Exit <span></span>
                </button>

        </div>

    </main>

<script>

    const beginButton =
        document.getElementById("begin-btn");

    const quitButton =
        document.getElementById("quit-btn");

    function startGame() {

        document.body.classList.add("leaving");

        setTimeout(function() {
            window.location.href = "home.html";
        }, 600);

    }

    function exitGame() {
        window.close();
    }

    beginButton.addEventListener("click", startGame);
    quitButton.addEventListener("click", exitGame);

</script>

</body>
</html>
